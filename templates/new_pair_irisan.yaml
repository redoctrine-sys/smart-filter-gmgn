# =====================================================================
# New Pair filter — "Irisan" template
# Source: synthesis of @ELPonyin, @badidoyo, @Andri_Snnn, @PradonoNovaldo
# Pipeline: newPair (poll 3-5s, source: GMGN trenches/new_pairs)
# =====================================================================
id: new_pair_irisan
name: "Irisan New Pair (default)"
pipeline: new_pair
score_threshold: 70

# ---- Hard rules: ANY failure -> drop the candidate -------------------
hard_rules:
  - metric: mint_authority
    op: equals
    value: revoked
  - metric: freeze_authority
    op: equals
    value: revoked
  - metric: top_10_holder_pct
    op: lt
    value: 25
  - metric: socials_count
    op: gte
    value: 1
  - metric: dev_holding_pct
    op: equals
    value: 0
  - metric: honeypot
    op: equals
    value: false
  - metric: candle_confirm_3_green
    op: equals
    value: true

# ---- Scoring: sum -> if >= score_threshold then ALERT ----------------
scoring:
  - metric: bundler_pct
    op: lt
    value: 6
    points: 25
  - metric: global_fee_sol
    op: gt
    value: 1
    points: 20
  - metric: top1_holder_balance_sol
    op: gte
    value: 0.5
    points: 15
  - metric: insider_holder_pct
    op: lt
    value: 5
    points: 15
  - metric: launchpad
    op: in
    value: [pump, raydium, raydium_clmm, raydium_v3]
    points: 10
  - metric: age_hours
    op: lt
    value: 24
    points: 15

# ---- Boosters (optional signals; add to score) -----------------------
boosters:
  - metric: smart_money_buys
    op: gte
    value: 2
    points: 10
  - metric: dex_paid_status
    op: equals
    value: paid
    points: 10

# ---- Wallet composition rules (OFF by default — uncomment to enable) -
# These are display-only by default. Uncomment to gate / score.
#
# Example: avoid bot armies (top10 average wallet < 0.1 SOL = mostly snipers)
#   - { metric: top10_avg_sol_balance, op: gte, value: 0.1, points: 10 }
#
# Example: prefer buy-heavy top100 (lifetime accumulation > distribution)
#   - { metric: top100_buy_sell_ratio, op: gte, value: 1.5, points: 10 }
#
# Example: at least one whale in top10 (max SOL balance >= 50)
#   - { metric: top10_max_sol_balance, op: gte, value: 50, points: 5 }
